name: mandala-sbdp

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mandala_sample}
      POSTGRES_USER: ${POSTGRES_USER:-mandala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mandala_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mandala-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  otel-collector:
    image: mandala-sbdp/otel-collector:0.128.0
    build:
      context: ./infra/local
      dockerfile: containers/otel-collector.Dockerfile
    command: ["--config=/mandala-config.yaml"]
    user: "0:0"
    depends_on:
      jaeger:
        condition: service_started
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - mandala-trace-data:/var/lib/mandala-traces
    restart: unless-stopped

volumes:
  mandala-postgres-data:
  mandala-trace-data:
    name: mandala-sbdp-traces
