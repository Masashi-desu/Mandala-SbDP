spring:
  application:
    name: mandala-sample-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mandala}
    username: ${DATABASE_USERNAME:mandala}
    password: ${DATABASE_PASSWORD:mandala}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 30m

doma:
  dialect: POSTGRES
  naming: SNAKE_LOWER_CASE
  exception-translation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Mandala task-management sample backend
    version: 0.1.0-SNAPSHOT

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: true

mandala:
  tracing:
    enabled: true
    use-global: ${MANDALA_USE_GLOBAL_OTEL:false}
    instrumentation-name: io.github.mandala.sbdp.sample
    export:
      enabled: ${OTEL_EXPORT_ENABLED:true}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    org.seasar.doma.jdbc.UtilLoggingJdbcLogger: DEBUG
