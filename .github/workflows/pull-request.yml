name: Pull request verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mandala-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      MANDALA_ANALYZED_AT: "2025-01-01T00:00:00Z"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.10.0"

      - name: Set up pinned dependencies and browsers
        run: ./scripts/setup.sh

      - name: Test, capture, refresh, render, and verify
        run: ./scripts/verify.sh

      - name: Verify semantic snapshot stability
        run: ./gradlew --console=plain :mandala-cli:run --args="diff --fail-on-change"

      - name: Confirm Pages public bundle boundary
        run: |
          test -f site/dist/index.html
          test -f site/dist/en/index.html
          test -f site/dist/docs/overview.html
          test -f site/dist/docs/en/overview.html
          test -f site/dist/sample/index.html
          test -f site/dist/sample/page-map.json
          test -z "$(find site/dist -type f \( -name mandala.json -o -name otlp.json \) -print -quit)"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mandala-verification-evidence
          path: |
            mandala/generated/sample-app/reports
            build/reports
            platform/java/*/build/reports
            sample-app/backend/build/reports
            mandala/cache/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local stack
        if: always()
        run: ./scripts/stop.sh
