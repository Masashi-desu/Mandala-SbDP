name: Pull request verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mandala-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      MANDALA_ANALYZED_AT: "2025-01-01T00:00:00Z"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.10.0"

      - name: Set up pinned dependencies and browsers
        run: ./scripts/setup.sh

      - name: Test, capture, refresh, render, and verify
        run: ./scripts/verify.sh

      - name: Verify semantic snapshot stability
        run: ./gradlew --console=plain :mandala-cli:run --args="diff --fail-on-change"

      - name: Confirm Pages public bundle boundary
        run: |
          test -f site/dist/index.html
          test -f site/dist/en/index.html
          test -f site/dist/docs/overview.html
          test -f site/dist/docs/en/overview.html
          test -f site/dist/sample/index.html
          test -f site/dist/sample/page-map.json
          test -z "$(find site/dist -type f \( -name mandala.json -o -name otlp.json \) -print -quit)"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mandala-verification-evidence
          path: |
            mandala/generated/sample-app/reports
            build/reports
            platform/java/*/build/reports
            sample-app/backend/build/reports
            mandala/cache/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local stack
        if: always()
        run: ./scripts/stop.sh
