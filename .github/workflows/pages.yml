name: Documentation and sample Mandala Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.10.0"

      - name: Install pinned dependencies
        run: npm ci

      - name: Build and link-check the Pages bundle
        run: npm run site:build

      - name: Enforce the public bundle boundary
        run: |
          test -f site/dist/index.html
          test -f site/dist/en/index.html
          test -f site/dist/docs/overview.html
          test -f site/dist/docs/en/overview.html
          test -f site/dist/sample/index.html
          test -f site/dist/sample/page-map.json
          test -z "$(find site/dist -type f \( -name mandala.json -o -name otlp.json \) -print -quit)"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the Pages-ready site/dist bundle
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy documentation and sample Mandala
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
