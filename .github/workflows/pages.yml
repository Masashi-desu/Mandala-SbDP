name: Documentation and sample Mandala Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.10.0"

      - name: Install pinned dependencies
        run: npm ci

      - name: Build and link-check the Pages bundle
        run: npm run site:build

      - name: Enforce the public bundle boundary
        run: |
          test -f site/dist/index.html
          test -f site/dist/en/index.html
          test -f site/dist/docs/overview.html
          test -f site/dist/docs/en/overview.html
          test -f site/dist/sample/index.html
          test -f site/dist/sample/page-map.json
          test -z "$(find site/dist -type f \( -name mandala.json -o -name otlp.json \) -print -quit)"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the Pages-ready site/dist bundle
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy documentation and sample Mandala
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
